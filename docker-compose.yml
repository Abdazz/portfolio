services:
  app:
    build:
      context: .
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    image: portfolio-app:dev
    container_name: portfolio-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    # These override the host .env so the container talks to compose services.
    # The host .env stays untouched so host-native dev keeps working.
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-portfolio}
      DB_USERNAME: ${DB_USERNAME:-portfolio}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [portfolio]

  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [portfolio]

  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-portfolio}
      POSTGRES_USER: ${DB_USERNAME:-portfolio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # 5433 on host to avoid clash with a native local Postgres on 5432.
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-portfolio} -d ${DB_DATABASE:-portfolio}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [portfolio]

  redis:
    image: redis:7-alpine
    container_name: portfolio-redis
    ports:
      - "${REDIS_PORT_HOST:-6380}:6379"
    volumes:
      - redis-data:/data
    networks: [portfolio]

  node:
    image: node:22-alpine
    container_name: portfolio-node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks: [portfolio]

  mailpit:
    image: axllent/mailpit:latest
    container_name: portfolio-mailpit
    ports:
      - "${MAIL_PORT_HOST:-1025}:1025"
      - "${MAIL_UI_PORT:-8025}:8025"
    networks: [portfolio]

volumes:
  postgres-data:
  redis-data:

networks:
  portfolio:
    driver: bridge
