- generic [ref=e2]: "{\"data\":{\"locale\":\"en\",\"template\":\"default\",\"profile\":{\"name\":\"Abdoul-Aziz ZOROM\",\"headline\":\"Senior Full-Stack Developer & AI Expert\",\"bio\":\"Senior Full-Stack Developer and AI Expert with over 8 years of experience building scalable web platforms and intelligent systems. Specialising in Laravel, Livewire, Angular, and modern AI technologies including LangChain, RAG pipelines, and multi-agent orchestration. Currently CTO at YULCOM Technologies, leading national and international digital transformation projects across Burkina Faso and beyond. I blend creativity, precision, and innovation to deliver next-generation digital experiences.\",\"email\":\"abdoulazizzorom@gmail.com\",\"phone\":\"+226 77-40-61-01\",\"location\":\"Karpala, Ouagadougou, Burkina Faso\",\"social_links\":{\"linkedin\":\"https:\\/\\/linkedin.com\\/in\\/abdoul-aziz-zorom\"}},\"experiences\":[{\"title\":\"Chief Technology Officer (CTO)\",\"company\":\"YULCOM Technologies Burkina\",\"location\":\"Ouagadougou, Burkina Faso\",\"start_date\":\"2024-04\",\"end_date\":null,\"description\":\"Lead the technical direction and full-stack development of large-scale national and international digital transformation projects. Oversee multidisciplinary teams and contribute directly to backend and frontend development using Laravel, Livewire, Spring Boot, Angular, Docker, and CI\\/CD pipelines to deliver secure, scalable, and high-performance platforms.\"},{\"title\":\"Consultant \\u2014 Full-Stack Developer\",\"company\":\"Class Navigator (Netherlands)\",\"location\":\"Remote \\u2014 Netherlands\",\"start_date\":\"2022-11\",\"end_date\":null,\"description\":\"Engineered an innovative travel planning and booking platform (BidOnMyTrip) allowing travel agents to compete in real time. Built with Laravel, Angular, Docker, OpenAI API, LangChain, and Elasticsearch. URL: https:\\/\\/www.bidonmytrip.com\"},{\"title\":\"Lead Full-Stack Web Developer\",\"company\":\"Yulcom Technologies\",\"location\":\"Ouagadougou, Burkina Faso\",\"start_date\":\"2022-05\",\"end_date\":\"2024-03\",\"description\":\"Led the design and development of complex web platforms using Laravel, Livewire, Spring Boot, Angular, and modern DevOps tools. Collaborated closely with cross-functional teams to deliver scalable, secure, and high-performance solutions for national and international projects.\"},{\"title\":\"Consultant \\u2014 Full-Stack Developer\",\"company\":\"Class Navigator (Netherlands)\",\"location\":\"Remote \\u2014 Netherlands\",\"start_date\":\"2023-04\",\"end_date\":\"2023-06\",\"description\":\"Designed and implemented a complete and feature-rich school management platform built with the TALL stack (Tailwind CSS, Alpine.js, Laravel, Livewire). URL: http:\\/\\/staging-classnavigator.bytebrew.nl\\/\"},{\"title\":\"Lead Full-Stack Developer\",\"company\":\"Switch Maker\",\"location\":\"Ouagadougou, Burkina Faso\",\"start_date\":\"2020-10\",\"end_date\":\"2022-04\",\"description\":\"Led end-to-end development of dynamic web applications, contributing to both backend and frontend layers using Laravel, Vue.js, and Livewire. Designed and implemented scalable architectures, optimised performance, and ensured code quality through best development practices.\"},{\"title\":\"Laravel Trainer\",\"company\":\"Switch Maker\",\"location\":\"Ouagadougou, Burkina Faso\",\"start_date\":\"2021-04\",\"end_date\":\"2021-05\",\"description\":\"Trained over 100 people in Laravel and e-services development techniques within the E-Burkina Project, aimed at extending the virtual counter of Burkina Faso's public administration.\"},{\"title\":\"Founder\",\"company\":\"DigiClass\",\"location\":\"Ouagadougou, Burkina Faso\",\"start_date\":\"2018-08\",\"end_date\":null,\"description\":\"Founded DigiClass, an online learning platform with the mission of improving academic outcomes for students in Africa through ICT. Tony Elumelu Foundation #TEF 2018 laureate. Website: www.digiclass.co