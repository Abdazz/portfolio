name: deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── build & push image to GHCR ──────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── deploy to VPS (requires manual approval in GitHub Environments) ──────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production        # configure approval gate in repo Settings → Environments

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/portfolio
            IMAGE_TAG=${{ needs.build.outputs.image_tag }} \
              IMAGE_NAME=${{ env.IMAGE_NAME }} \
              docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG=${{ needs.build.outputs.image_tag }} \
              IMAGE_NAME=${{ env.IMAGE_NAME }} \
              docker compose -f docker-compose.prod.yml up -d --remove-orphans

      # Rollback: docker compose -f docker-compose.prod.yml up -d app:<previous-sha-tag>
