services:
  # ── one-shot: runs migrations then exits ──────────────────────────────────
  migrations:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME}:${IMAGE_TAG:-latest}
    command: php artisan migrate --force --no-interaction
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    networks: [portfolio]
    restart: "no"

  # ── application (PHP-FPM) ─────────────────────────────────────────────────
  app:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME}:${IMAGE_TAG:-latest}
    env_file: .env.prod
    volumes:
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [portfolio]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── queue worker (Horizon) ────────────────────────────────────────────────
  horizon:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME}:${IMAGE_TAG:-latest}
    command: php artisan horizon
    env_file: .env.prod
    volumes:
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks: [portfolio]
    restart: unless-stopped

  # ── scheduler ─────────────────────────────────────────────────────────────
  scheduler:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME}:${IMAGE_TAG:-latest}
    command: php artisan schedule:work
    env_file: .env.prod
    volumes:
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks: [portfolio]
    restart: unless-stopped

  # ── nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Serve uploaded media from the shared storage volume
      - storage:/var/www/html/storage/app:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [portfolio]
    restart: unless-stopped

  # ── Caddy (TLS termination + reverse proxy) ───────────────────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [nginx]
    networks: [portfolio]
    restart: unless-stopped

  # ── postgres ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [portfolio]
    restart: unless-stopped

  # ── redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks: [portfolio]
    restart: unless-stopped

  # ── daily backup (pg_dump → Cloudflare R2) ────────────────────────────────
  backup:
    image: amazon/aws-cli:latest
    entrypoint: ["sh", "-c", "apk add --no-cache postgresql-client && crond -f -d 8"]
    env_file: .env.prod
    environment:
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
    volumes:
      - ./docker/scripts/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [portfolio]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  storage:
  logs:
  caddy-data:
  caddy-config:

networks:
  portfolio:
    driver: bridge
